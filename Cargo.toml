[package]
name = "pngsecret"
version = "0.1.0"
edition = "2021"
description = "A steganography tool for embedding secret messages in PNG images"
readme = "README.md"
license = "MIT"
keywords = ["steganography", "png", "image", "secret", "lsb"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
image = "0.25.2"
quickcheck = "1.0.3"
structopt = "0.3.26"

[profile.release]
strip = true
codegen-units = 1
opt-level = 3
lto = true
panic = "abort"
